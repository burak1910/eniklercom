<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1a0d08">
<title>Enik Düşüşü – Tam Zamanında Atla! | enikler.com</title>
<meta name="description" content="Tam zamanında dokun, eniği dikenli deliğe cuk diye düşür! Rezalet'ten Tanrısal'a rütbeni kap, skorunu X'te paylaş.">
<link rel="canonical" href="https://enikler.com/oyun/enik-dusus/">

<meta property="og:description" content="Tam zamanında atla, dikenlere değmeden dibe düş. Beni geçebilir misin?">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Enik Düşüşü 🐾 Cuk diye düşürebilir misin?">
<meta name="twitter:description" content="Tam zamanında atla, dikenlere değmeden dibe düş. Beni geçebilir misin?">

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --accent:#FFB703; --accent-d:#F08C00; --ink:#2B2118; --like:#22B573; --nope:#F0506E; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:#0e0705; overflow:hidden; overscroll-behavior:none; }
  body { font-family:'Nunito',system-ui,sans-serif; color:#fff; user-select:none; -webkit-user-select:none; touch-action:none; }
  #wrap { position:fixed; inset:0; max-width:480px; margin:0 auto; }
  canvas { display:block; width:100%; height:100%; }
  .hidden { display:none !important; }

  #hud { position:absolute; top:calc(env(safe-area-inset-top) + 10px); left:12px; right:12px; display:flex; justify-content:space-between; align-items:flex-start; pointer-events:none; }
  #hud .m { font-weight:900; font-size:2.2rem; line-height:1; text-shadow:0 3px 0 rgba(0,0,0,.4); }
  #hud .m small { font-size:1rem; opacity:.8; }
  #hud .best { font-weight:800; font-size:.85rem; opacity:.75; text-align:right; }
  #home { pointer-events:auto; display:inline-block; margin-top:6px; color:var(--accent); font-weight:900; font-size:.85rem; text-decoration:none; }

  #pop { position:absolute; left:0; right:0; top:28%; text-align:center; font-weight:900; font-size:2.4rem; pointer-events:none;
         opacity:0; transform:scale(.6); transition:opacity .25s, transform .25s; text-shadow:0 4px 0 rgba(0,0,0,.45); }
  #pop.on { opacity:1; transform:scale(1); }

  #over { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:16px; background:rgba(14,7,5,.55); }
  #over.hidden { display:none; }
  .card { width:100%; max-width:340px; background:#FFF8E7; color:var(--ink); border-radius:28px; padding:24px 20px 20px; text-align:center; box-shadow:0 20px 40px rgba(0,0,0,.4); animation:in .3s ease-out; }
  @keyframes in { from { transform:translateY(30px) scale(.9); opacity:0; } }
  .card .rank { font-weight:900; font-size:2.3rem; line-height:1.1; margin:2px 0 4px; }
  .card .dep { font-weight:900; font-size:1.2rem; }
  .card .bst { font-weight:800; font-size:.9rem; color:#8a7a66; margin-top:2px; }
  .card .rec { display:inline-block; margin-top:8px; background:var(--nope); color:#fff; font-weight:900; font-size:.8rem; padding:4px 12px; border-radius:99px; }
  .btn { display:block; width:100%; margin-top:12px; border:0; border-radius:16px; padding:14px; font:900 1.1rem 'Nunito',sans-serif; cursor:pointer; text-decoration:none; }
  .btn.go { background:var(--accent); color:#fff; box-shadow:0 5px 0 var(--accent-d); }
  .btn.sh { background:#111; color:#fff; box-shadow:0 5px 0 #000; }
  .btn:active { transform:translateY(3px); box-shadow:none; }
  .card a.site { display:block; margin-top:14px; font-weight:800; font-size:.85rem; color:#8a7a66; text-decoration:none; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" aria-label="Enik Düşüşü oyunu"></canvas>
  <div id="hud">
    <div><div class="m"><small>Seviye </small><span id="lv">1</span></div><a id="home" href="/">← enikler.com</a></div>
    <div class="best">En iyi<br><span id="bm">–</span></div>
  </div>
  <div id="pop"></div>
  <div id="over" class="hidden">
    <div class="card">
      <div style="font-size:3rem">🐾</div>
      <div class="rank" id="oRank">Rezalet</div>
      <div class="dep">Seviye <span id="oLv">1</span></div>
      <div class="bst">En iyin: <span id="oBest">–</span></div>
      <div id="oRec" class="rec hidden">YENİ REKOR!</div>
      <button class="btn go" id="again" type="button">Tekrar Dene</button>
      <button class="btn sh" id="share" type="button">Skorunu Paylaş 𝕏</button>
      <a class="site" href="/">Diğer enik testleri için enikler.com 🐾</a>
    </div>
  </div>
</div>

<script>
(() => {
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const GAME_URL = 'https://enikler.com/oyun/enik-dusus/';

/* ---------- Ayarlar ---------- */
const W = 360;          // dünya genişliği (birim)
const D = 1600;         // kuyunun derinliği
const LEDGE = 100;      // platformun sağ ucu = sol duvarın üstü
const TOP_R = 300;   // sağ duvarın üstü
const ER = 13;          // enik yarıçapı
const SPIKE = 11;       // diken boyu
const HIT = ER * 0.8 + SPIKE * 0.5; // merkezden duvara izin verilen en yakın mesafe
const STEP = 1000 / 60; // sabit fizik adımı (her cihazda aynı zıplama)
const RANKS = [
  ['Rezalet',    '#2a0b08', '#ff8a7a'],
  ['Kötü',       '#3b1209', '#ff9e6b'],
  ['İdare Eder', '#3d2a08', '#ffc94a'],
  ['Fena Değil', '#2d3a0a', '#d6f25a'],
  ['İyi',        '#0e3a1b', '#5cf08a'],
  ['Harika',     '#0a3a34', '#4ff0d6'],
  ['Süper',      '#0b2c44', '#5cc8ff'],
  ['Muhteşem',   '#1b1c4c', '#8f9bff'],
  ['Kusursuz',   '#301446', '#d88cff'],
  ['Efsane',     '#44122f', '#ff6ec4'],
  ['Tanrısal',   '#3d3410', '#ffe14d']
];
const BAND = D / (RANKS.length - 1); // ilk 10 rütbe kuyu boyunca, Tanrısal = dibe ulaşmak

/* ---------- Durum ---------- */
let scale = 1, viewH = 600, dpr = 1;
let lvl, cfg, e, state, camY, shake, parts, deadAt = 0, deadRank = 0, best = null, winAt = 0;

try { best = JSON.parse(localStorage.getItem('enikDususBest2')); } catch (_) {}
const scoreOf = (l, r) => (l - 1) * RANKS.length + r;
const fmt = b => b ? 'Sv ' + b.l + ' · ' + RANKS[b.r][0] : '–';
$('bm').textContent = fmt(best);

function resize() {
  const r = cv.getBoundingClientRect();
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  scale = cv.width / W; viewH = cv.height / scale;
}
addEventListener('resize', resize);

/* ---------- Seviye ---------- */
function makeLevel(l) {
  const bw = Math.max(40, 64 - 2.5 * (l - 1));                 // dipteki deliğin genişliği
  const cx = l === 1 ? 156 : 140 + Math.random() * 32;       // deliğin ortası
  const speed = Math.min(2.0, 1.1 + 0.09 * (l - 1));         // eniğin yürüme hızı
  return { bw, cx, speed, lb: cx - bw / 2, rb: cx + bw / 2 };
}
const lx = y => LEDGE + (cfg.lb - LEDGE) * Math.min(1, Math.max(0, y) / D);
const rx = y => TOP_R + (cfg.rb - TOP_R) * Math.min(1, Math.max(0, y) / D);

function startLevel(l) {
  lvl = l; cfg = makeLevel(l);
  e = { x:30, y:0, vx:0, vy:0, dir:1, walk:0, rot:0 };
  state = 'ready'; parts = [];
  $('lv').textContent = lvl;
}
function newGame() {
  startLevel(1); camY = -viewH * 0.45; shake = 0;
  $('over').classList.add('hidden');
}

function jump() {
  if (state !== 'ready') return;
  state = 'air'; e.vy = -6; e.vx = 8.8;
}

function burst(x, y, n, colors) {
  for (let k = 0; k < n; k++) {
    const a = Math.random() * Math.PI * 2, s = 1 + Math.random() * 4;
    parts.push({ x, y, vx:Math.cos(a) * s, vy:Math.sin(a) * s - 1.5, life:1, c:colors[k % colors.length] });
  }
}

function pop(text, color) {
  const p = $('pop'); p.textContent = text; p.style.color = color; p.classList.add('on');
  clearTimeout(pop.t); pop.t = setTimeout(() => p.classList.remove('on'), 1100);
}

function die() {
  state = 'dead'; deadAt = performance.now(); shake = 14;
  deadRank = Math.max(0, Math.min(RANKS.length - 2, Math.floor(e.y / BAND)));
  try { navigator.vibrate && navigator.vibrate(70); } catch (_) {}
  burst(e.x, e.y, 22, ['#f4d9a8', '#f4d9a8', '#c98b4a']);
  const sc = scoreOf(lvl, deadRank), rec = !best || sc > scoreOf(best.l, best.r);
  if (rec) { best = { l:lvl, r:deadRank }; try { localStorage.setItem('enikDususBest2', JSON.stringify(best)); } catch (_) {} $('bm').textContent = fmt(best); }
  if (typeof gtag === 'function') gtag('event', 'oyun_bitti', { oyun:'enik_dusus', seviye:lvl, rutbe:RANKS[deadRank][0] });
  setTimeout(() => {
    if (state !== 'dead') return;
    const rk = RANKS[deadRank];
    $('oRank').textContent = rk[0]; $('oRank').style.color = shade(rk[2]);
    $('oLv').textContent = lvl; $('oBest').textContent = fmt(best);
    $('oRec').classList.toggle('hidden', !rec);
    $('over').classList.remove('hidden');
  }, 750);
}
const shade = hex => {
  const n = parseInt(hex.slice(1), 16), f = .62;
  return 'rgb(' + [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(v => Math.round(v * f)).join(',') + ')';
};

function win() {
  state = 'win'; winAt = performance.now();
  e.y = D - ER; e.vy = 0; e.vx = 0; e.rot = 0;
  pop('Tanrısal! 🎉', RANKS[RANKS.length - 1][2]);
  burst(e.x, e.y, 30, ['#ffe14d', '#ff6ec4', '#5cc8ff', '#5cf08a']);
  try { navigator.vibrate && navigator.vibrate([30, 40, 30]); } catch (_) {}
  const r = RANKS.length - 1;
  if (!best || scoreOf(lvl, r) > scoreOf(best.l, best.r)) { best = { l:lvl, r }; try { localStorage.setItem('enikDususBest2', JSON.stringify(best)); } catch (_) {} $('bm').textContent = fmt(best); }
  if (typeof gtag === 'function') gtag('event', 'seviye_gecti', { oyun:'enik_dusus', seviye:lvl });
}

/* ---------- Fizik (sabit adım) ---------- */
function step() {
  if (state === 'ready') {
    e.x += cfg.speed * e.dir; e.walk += .25;
    if (e.x > LEDGE - 14) { e.x = LEDGE - 14; e.dir = -1; }
    if (e.x < 20) { e.x = 20; e.dir = 1; }
  } else if (state === 'air') {
    const py = e.y;
    e.vy = Math.min(12, e.vy + 0.4);
    e.vx *= 0.92;
    e.x += e.vx; e.y += e.vy;
    e.rot += (e.vx * 0.05 - e.rot) * 0.2;
    // erken dokunduysa tekrar platforma kondu
    if (py <= 0 && e.y > 0 && e.x < LEDGE) { e.y = 0; e.vy = 0; e.vx = 0; e.rot = 0; e.dir = 1; state = 'ready'; return; }
    if (e.y > 0) {
      if (e.x - HIT < lx(e.y) || e.x + HIT > rx(e.y)) { die(); return; }
      if (e.y >= D - ER) { win(); return; }
    }
  } else if (state === 'win') {
    if (performance.now() - winAt > 1400) startLevel(lvl + 1);
  }
  parts.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .2; p.life -= .02; });
  parts = parts.filter(p => p.life > 0);
  shake *= 0.86;
  const target = state === 'ready' ? -viewH * 0.45 : Math.min(e.y - viewH * 0.4, D + 60 - viewH * 0.8);
  camY += (target - camY) * (state === 'ready' ? 0.08 : 0.15);
}

/* ---------- Çizim ---------- */
function draw(now) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#120806'; ctx.fillRect(0, 0, cv.width, cv.height);
  const sx = (Math.random() - .5) * shake, sy = (Math.random() - .5) * shake;
  ctx.setTransform(scale, 0, 0, scale, sx * scale, (sy - camY) * scale);
  const top = camY, bot = camY + viewH;

  // yıldızlar
  if (top < 0) {
    ctx.fillStyle = 'rgba(255,240,200,.35)';
    for (let k = 0; k < 30; k++) { const x = (k * 97) % W, y = -((k * 53) % 600) - 20; if (y > top) ctx.fillRect(x, y, 2, 2); }
  }

  // rütbe bantları
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let z = 0; z < RANKS.length - 1; z++) {
    const y0 = z * BAND; if (y0 > bot || y0 + BAND < top) continue;
    const rk = RANKS[z];
    ctx.fillStyle = rk[1]; ctx.fillRect(0, y0, W, BAND);
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(0, y0, W, 3);
    const ly = y0 + BAND / 2;
    ctx.font = '900 ' + Math.min(30, (rx(ly) - lx(ly)) / 4) + 'px Nunito, sans-serif';
    ctx.fillStyle = rk[2]; ctx.globalAlpha = .55;
    ctx.fillText(rk[0], (lx(ly) + rx(ly)) / 2, ly);
    ctx.globalAlpha = 1;
  }
  // dip: Tanrısal yatağı
  const gr = RANKS[RANKS.length - 1];
  ctx.fillStyle = gr[1]; ctx.fillRect(0, D, W, 400);
  ctx.fillStyle = '#c98b4a'; ctx.fillRect(cfg.lb, D, cfg.bw, 10);
  ctx.fillStyle = '#ff9eb5'; ctx.beginPath(); ctx.ellipse(cfg.cx, D + 2, cfg.bw / 2 - 2, 6, 0, Math.PI, 0); ctx.fill();
  ctx.font = '900 22px Nunito, sans-serif'; ctx.fillStyle = gr[2];
  ctx.fillText('Tanrısal', cfg.cx, D + 40);

  // kaya duvarları
  ctx.fillStyle = 'rgba(20,8,5,.88)';
  ctx.beginPath(); ctx.moveTo(0, 6); ctx.lineTo(LEDGE, 6); ctx.lineTo(cfg.lb, D); ctx.lineTo(cfg.lb, D + 400); ctx.lineTo(0, D + 400); ctx.fill();
  ctx.beginPath(); ctx.moveTo(W, -1); ctx.lineTo(TOP_R, -1); ctx.lineTo(cfg.rb, D); ctx.lineTo(cfg.rb, D + 400); ctx.lineTo(W, D + 400); ctx.fill();

  // duvar kenarı + dikenler
  for (const [x0, y0, x1, y1, side] of [[LEDGE, 0, cfg.lb, D, 1], [TOP_R, 0, cfg.rb, D, -1]]) {
    ctx.strokeStyle = '#c98b4a'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    const len = Math.hypot(x1 - x0, y1 - y0), ux = (x1 - x0) / len, uy = (y1 - y0) / len;
    const nx = uy * side, ny = -ux * side, n = Math.floor(len / 14);
    ctx.fillStyle = '#9b6bff'; ctx.strokeStyle = '#e9ddff'; ctx.lineWidth = 1.2;
    const k0 = Math.max(0, Math.floor((top - y0 - 20) / (y1 - y0) * n)), k1 = Math.min(n, Math.ceil((bot - y0 + 20) / (y1 - y0) * n));
    for (let k = k0; k < k1; k++) {
      const a = k / n, b = (k + 1) / n, m = (a + b) / 2;
      ctx.beginPath();
      ctx.moveTo(x0 + (x1 - x0) * a, y0 + (y1 - y0) * a);
      ctx.lineTo(x0 + (x1 - x0) * m + nx * SPIKE, y0 + (y1 - y0) * m + ny * SPIKE);
      ctx.lineTo(x0 + (x1 - x0) * b, y0 + (y1 - y0) * b);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }
  }

  // platform
  ctx.fillStyle = '#FFF4D6'; ctx.fillRect(0, -1, LEDGE, 7);
  ctx.fillRect(TOP_R, -1, W - TOP_R, 7);

  // enik
  if (state !== 'dead') drawEnik(e.x, e.y - (state === 'ready' ? ER : 0), state === 'ready' ? e.dir : 1, e.rot, now);

  // parçacıklar
  parts.forEach(p => { ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, 3.5, 0, 7); ctx.fill(); });
  ctx.globalAlpha = 1;

  // ipucu
  if (state === 'ready') {
    const bob = Math.sin(now / 250) * 3;
    ctx.font = '900 20px Nunito, sans-serif'; ctx.fillStyle = '#FFB703';
    ctx.fillText(lvl === 1 ? 'Tam zamanında dokun!' : 'Seviye ' + lvl, W / 2, -150 + bob);
    ctx.font = '800 14px Nunito, sans-serif'; ctx.fillStyle = 'rgba(255,244,214,.8)';
    ctx.fillText(lvl === 1 ? 'Eniği deliğe cuk diye düşür 🐾' : 'Delik daraldı, enik hızlandı!', W / 2, -124 + bob);
  }
}

function drawEnik(x, y, dir, rot, now) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(dir, 1);
  const fall = state === 'air', leg = state === 'ready' ? Math.sin(e.walk) * 3 : 0;
  ctx.strokeStyle = '#d9a066'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-11, 2); ctx.quadraticCurveTo(-20, -6 + Math.sin(now / 90) * 4, -17, -13); ctx.stroke();
  ctx.strokeStyle = '#e8b97f'; ctx.lineWidth = 4.5;
  ctx.beginPath();
  ctx.moveTo(-6, 7); ctx.lineTo(-6 + leg, fall ? 11 : 13);
  ctx.moveTo(6, 7); ctx.lineTo(6 - leg, fall ? 11 : 13); ctx.stroke();
  ctx.fillStyle = '#f4d9a8'; ctx.beginPath(); ctx.ellipse(-1, 3, 12, 9, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(7, -6, 10, 0, 7); ctx.fill();
  ctx.fillStyle = '#c98b4a';
  ctx.beginPath(); ctx.ellipse(0, -9, 4, 8, fall ? -1.2 : 0.35, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(13, -11, 3.5, 7, fall ? 1.1 : -0.25, 0, 7); ctx.fill();
  ctx.fillStyle = '#2B2118';
  if (fall) { ctx.beginPath(); ctx.arc(10, -8, 2.6, 0, 7); ctx.fill(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(10.8, -8.8, .9, 0, 7); ctx.fill(); }
  else { ctx.beginPath(); ctx.arc(10, -8, 1.9, 0, 7); ctx.fill(); }
  ctx.fillStyle = '#2B2118'; ctx.beginPath(); ctx.arc(16.5, -4.5, 2.2, 0, 7); ctx.fill();
  if (fall) { ctx.beginPath(); ctx.arc(13, -0.5, 1.8, 0, 7); ctx.fill(); }
  ctx.fillStyle = 'rgba(240,80,110,.35)'; ctx.beginPath(); ctx.arc(7, -2, 2.5, 0, 7); ctx.fill();
  ctx.restore();
}

/* ---------- Kontroller: tek dokunuş ---------- */
cv.addEventListener('pointerdown', ev => { ev.preventDefault(); jump(); });
addEventListener('keydown', ev => {
  if (ev.key !== ' ' && ev.key !== 'Enter' && ev.key !== 'ArrowDown') return;
  ev.preventDefault();
  if (state === 'ready') jump();
  else if (state === 'dead' && performance.now() - deadAt > 800) newGame();
});

$('again').onclick = newGame;
$('share').onclick = async () => {
  const rk = RANKS[deadRank][0];
  const text = `Enik Düşüşü'nde Seviye ${lvl}'de "${rk}" oldum 🐾 Eniği cuk diye düşürebilir misin?`;
  if (typeof gtag === 'function') gtag('event', 'skor_paylas', { oyun:'enik_dusus', seviye:lvl });
  if (navigator.share) { try { await navigator.share({ text, url:GAME_URL }); } catch (_) {} return; }
  window.open('https://x.com/intent/post?text=' + encodeURIComponent(text) + '&url=' + encodeURIComponent(GAME_URL), '_blank', 'noopener');
};

/* ---------- Döngü ---------- */
let last = performance.now(), acc = 0;
function loop(now) {
  acc = Math.min(acc + (now - last), 200); last = now;
  while (acc >= STEP) { step(); acc -= STEP; }
  draw(now);
  requestAnimationFrame(loop);
}
resize(); newGame(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
